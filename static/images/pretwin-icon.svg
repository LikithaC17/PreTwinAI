<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#2E1065" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="iconFairyUpper" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="40%" stop-color="#9333EA" />
      <stop offset="80%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="iconFairyLower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <linearGradient id="iconStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="60%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="iconSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Rounded Background -->
  <rect width="64" height="64" rx="16" fill="url(#iconBg)" stroke="#4338CA" stroke-width="1.2" />

  <!-- Soaring Fairytale Emblem -->
  <g transform="translate(6, 6)" filter="url(#iconSoftGlow)">
    <!-- Swooping Flight Trail -->
    <path d="M 6 42 C 12 42, 18 38, 22 32 C 25 27, 28 22, 32 18" fill="none" stroke="#C4B5FD" stroke-width="1.4" stroke-dasharray="2,2" opacity="0.8" />
    <circle cx="8" cy="43" r="1" fill="#FEF08A" />
    <circle cx="15" cy="38" r="1.1" fill="#BAE6FD" />
    <circle cx="21" cy="32" r="1.2" fill="#FFFFFF" />

    <!-- Fairy Wings (Delicate, Upward & Outward) -->
    <!-- Left Wing -->
    <path d="M 27 25 C 21 16, 12 8, 2 8 C 1 15, 6 24, 18 29 Z" fill="url(#iconFairyUpper)" opacity="0.9" />
    <path d="M 26 26 C 21 21, 14 15, 6 17 C 7 21, 11 27, 20 29 Z" fill="url(#iconFairyLower)" opacity="0.75" />

    <!-- Right Wing -->
    <path d="M 31 24 C 37 15, 46 8, 54 9 C 54 16, 49 25, 37 29 Z" fill="url(#iconFairyUpper)" opacity="0.95" />
    <path d="M 32 26 C 37 21, 44 16, 50 18 C 49 22, 45 28, 36 30 Z" fill="url(#iconFairyLower)" opacity="0.75" />

    <!-- Fairy Graceful Body Silhouette -->
    <path d="M 27 21 C 28 19, 30 19, 31 21 C 31.5 23, 30.5 26, 29.5 29 C 28.5 33, 27 36, 26 38 C 27 35, 28 32, 28.5 28 Z" fill="#FFFFFF" opacity="0.98" />
    <circle cx="29.5" cy="18" r="2.6" fill="#FFFFFF" />

    <!-- Guiding Prediction Star -->
    <g transform="translate(42, 14)">
      <path d="M 0 -6 L 1.6 -1.6 L 6 0 L 1.6 1.6 L 0 6 L -1.6 1.6 L -6 0 L -1.6 -1.6 Z" fill="url(#iconStar)" />
      <circle cx="0" cy="0" r="1.4" fill="#FFFFFF" />
    </g>
  </g>
</svg>
