<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 50" width="210" height="50">
  <defs>
    <!-- Fairytale Gradients: Lavender, Violet, Periwinkle, Pearl, Soft Silver -->
    <linearGradient id="fairyWingUpper" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#9333EA" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#A78BFA" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#EDE9FE" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="fairyWingLower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#60A5FA" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#BAE6FD" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="fairyGlowTrail" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0" />
      <stop offset="50%" stop-color="#E0E7FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="fairyBody" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0E7FF" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <linearGradient id="starGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="50%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="logoWordPre" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <linearGradient id="logoWordTwin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <filter id="fairySoftGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- FLYING FAIRYTALE EMBLEM -->
  <g class="pretwin-fairy-group" transform="translate(4, 2)" filter="url(#fairySoftGlow)">
    <!-- Graceful Swooping Flight Trail -->
    <path d="M 2 36 C 8 36, 14 34, 18 29 C 21 25, 23 20, 26 17" fill="none" stroke="url(#fairyGlowTrail)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2,3" opacity="0.85" />
    <path d="M 5 39 C 11 38, 16 32, 22 24" fill="none" stroke="url(#fairyGlowTrail)" stroke-width="1" stroke-linecap="round" opacity="0.5" />

    <!-- Stardust Sparks Along Flight Path -->
    <circle cx="5" cy="38" r="0.8" fill="#C4B5FD" opacity="0.75" />
    <circle cx="10" cy="35" r="1.1" fill="#FEF08A" opacity="0.9" />
    <circle cx="15" cy="32" r="0.9" fill="#BAE6FD" opacity="0.8" />
    <circle cx="19" cy="26" r="1.2" fill="#FFFFFF" opacity="0.95" />
    <circle cx="39" cy="9" r="0.8" fill="#FEF08A" opacity="0.85" />
    <circle cx="43" cy="24" r="0.7" fill="#C4B5FD" opacity="0.7" />

    <!-- Delicate Fairy Wings (Spreading Outward & Upward in Flight) -->
    <!-- Left Major Upward Wing -->
    <path class="fairy-wing-left" d="M 24 20 C 20 12, 13 4, 3 4 C 1 10, 5 18, 17 23 C 20 22, 22 21, 24 20 Z" fill="url(#fairyWingUpper)" opacity="0.9" />
    <!-- Left Inner Filigree Wing -->
    <path class="fairy-wing-left-inner" d="M 23 21 C 18 16, 12 11, 6 12 C 6 16, 10 22, 18 24 Z" fill="url(#fairyWingLower)" opacity="0.7" />
    <!-- Left Lower Flutter Winglet -->
    <path d="M 22 23 C 17 24, 11 25, 7 29 C 9 32, 14 33, 19 27 Z" fill="url(#fairyWingUpper)" opacity="0.75" />

    <!-- Right Major Soaring Wing -->
    <path class="fairy-wing-right" d="M 27 19 C 32 11, 38 4, 47 5 C 47 11, 43 19, 32 23 C 30 22, 28 21, 27 19 Z" fill="url(#fairyWingUpper)" opacity="0.95" />
    <!-- Right Inner Filigree Wing -->
    <path class="fairy-wing-right-inner" d="M 28 21 C 33 16, 39 12, 44 14 C 44 18, 39 23, 31 24 Z" fill="url(#fairyWingLower)" opacity="0.7" />
    <!-- Right Lower Flutter Winglet -->
    <path d="M 28 23 C 33 24, 39 25, 42 29 C 40 32, 35 33, 30 27 Z" fill="url(#fairyWingUpper)" opacity="0.75" />

    <!-- Graceful Fairy Body Silhouette in Soaring Motion (Arched forward) -->
    <path d="M 24 16 C 24.5 14, 26 14, 27 15.5 C 27.5 17, 26.5 19, 25.5 21 C 25 23, 24.8 26, 24.2 29 C 23.8 31, 22.8 33, 22 34 C 22.5 32, 23.5 30, 24 27 C 24.5 24, 24.5 22, 24 20 Z" fill="url(#fairyBody)" opacity="0.98" />
    <!-- Fairy Head with Star Tiara -->
    <circle cx="26" cy="14" r="2.2" fill="url(#fairyBody)" />

    <!-- Predictive Guiding Star (Sparkling Ahead of the Fairy in Flight) -->
    <g transform="translate(35, 11)">
      <!-- 4-Point Sparkling Star -->
      <path d="M 0 -5 L 1.4 -1.4 L 5 0 L 1.4 1.4 L 0 5 L -1.4 1.4 L -5 0 L -1.4 -1.4 Z" fill="url(#starGlow)" />
      <!-- Star Glint Core -->
      <circle cx="0" cy="0" r="1.2" fill="#FFFFFF" />
    </g>
  </g>

  <!-- TYPOGRAPHY: PRETWIN -->
  <g transform="translate(56, 28)">
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" letter-spacing="-0.5" fill="url(#logoWordPre)">
      Pre<tspan fill="url(#logoWordTwin)" font-weight="900">Twin</tspan>
    </text>
  </g>

  <!-- SUBTITLE: ELEGANT FAIRYTALE & PREDICTIVE COMPANION -->
  <g transform="translate(57, 40)">
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.8" font-style="italic" font-weight="600" fill="#E0E7FF" letter-spacing="0.5">
      Predictive Shopping Twin <tspan fill="#FEF08A" font-weight="800">✦</tspan>
    </text>
  </g>
</svg>
