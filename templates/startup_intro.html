<!-- ======================================================================
     PRETWIN MAGICAL FAIRY-TALE STARTUP ANIMATION OVERLAY
     Visual: Graceful Fairy Sitting on a Glowing Crescent Half-Moon
             Full body in view from head to feet, uncropped, with fluttering wings
             and glowing magic wand releasing sparkling celestial particles.
     Sequence:
       1. Fade in dreamy night sky with twinkling stars and gentle moonlight glow.
       2. Crescent half-moon appears with glowing celestial aura.
       3. Complete fairy appears seated gracefully in the crescent moon cradle.
       4. Fairy remains seated while her delicate wings flutter softly.
       5. Magic wand star pulses and releases a sparkling particle beam toward center.
       6. Magical reveal of "PreTwin AI" wordmark in center.
       7. Tagline "Your Future. Your Style. Your Twin." appears with luminous glow.
       8. Smooth dissolve transition to login or shopping homepage.
     ====================================================================== -->
<div id="pretwinStartupIntro" class="pretwin-startup-overlay" style="display:none;" aria-hidden="true" role="dialog" aria-label="PreTwin Introduction">
  <!-- Accessible Skip Intro Button -->
  <button type="button" id="skipIntroBtn" onclick="skipStartupIntro()" class="pretwin-skip-intro-btn" title="Skip Animation and continue to website">
    Skip Intro ➔
  </button>

  <!-- Atmospheric Magical Floating Stars & Moonlight Particles -->
  <div class="pretwin-intro-sky">
    <div class="star-particle star-1">✦</div>
    <div class="star-particle star-2">✨</div>
    <div class="star-particle star-3">✦</div>
    <div class="star-particle star-4">✧</div>
    <div class="star-particle star-5">✨</div>
    <div class="star-particle star-6">✦</div>
    <div class="star-particle star-7">✧</div>
    <div class="star-particle star-8">✨</div>
    <div class="moonlight-aura"></div>
  </div>

  <!-- Central Stage: Crescent Moon with Seated Fairy & Magical Reveal -->
  <div class="pretwin-moon-stage" id="introMoonStage">
    
    <!-- Official PreTwin AI Fairy Scene Banner (Derived directly from uploaded reference image with project branding) -->
    <div class="pretwin-intro-banner-container" id="introBannerContainer">
      <div class="pretwin-banner-glow-halo"></div>
      <img src="{{ url_for('static', filename='images/pretwin_fairy_banner.png') }}" 
           alt="PreTwin AI - Your Future. Your Style. Your Twin." 
           class="pretwin-intro-banner-image" 
           id="introBannerImage" />
      <div class="pretwin-banner-light-sweep" id="bannerLightSweep"></div>
    </div>

    <!-- Fairy Sitting Gracefully on Crescent Half-Moon Component -->
    <div class="pretwin-moon-fairy-wrap" id="moonFairyContainer">
      <svg class="pretwin-moon-fairy-svg pretwin-fairy-svg" viewBox="0 0 420 380" width="380" height="344" aria-label="PreTwin Fairy Sitting on Crescent Moon">
        <defs>
          <!-- Moon Warm Golden Gradient -->
          <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fffbeb" />
            <stop offset="30%" stop-color="#fef08a" />
            <stop offset="70%" stop-color="#facc15" />
            <stop offset="100%" stop-color="#ca8a04" />
          </linearGradient>

          <!-- Fairy Gown Twilight Lavender Gradient -->
          <linearGradient id="fairyDressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fdf4ff" />
            <stop offset="40%" stop-color="#e879f9" />
            <stop offset="100%" stop-color="#9333ea" />
          </linearGradient>

          <!-- Iridescent Wings Gradients -->
          <linearGradient id="wingGradUpper" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.85" />
            <stop offset="40%" stop-color="#a855f7" stop-opacity="0.9" />
            <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.92" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.98" />
          </linearGradient>

          <linearGradient id="wingGradLower" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
            <stop offset="50%" stop-color="#f472b6" stop-opacity="0.88" />
            <stop offset="100%" stop-color="#fde047" stop-opacity="0.92" />
          </linearGradient>

          <!-- Skin & Hair Gradients -->
          <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fff1f2" />
            <stop offset="100%" stop-color="#fecdd3" />
          </linearGradient>

          <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a" />
            <stop offset="50%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#b45309" />
          </linearGradient>

          <!-- Glow Filters -->
          <filter id="moonGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>

          <filter id="fairyGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>

          <filter id="starGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- Glowing Crescent Half-Moon (Outer Arc & Inner Cradle) -->
        <g class="crescent-moon-group" filter="url(#moonGlow)">
          <path class="crescent-moon-path" d="M 185 35 C 80 45, 15 130, 25 245 C 35 325, 115 360, 205 345 C 135 320, 80 255, 80 185 C 80 110, 125 50, 185 35 Z" fill="url(#moonGrad)" />
          <!-- Subtle Lunar Craters / Shimmer Details -->
          <circle cx="65" cy="190" r="14" fill="#fef08a" opacity="0.32" />
          <circle cx="95" cy="265" r="10" fill="#fef08a" opacity="0.28" />
          <circle cx="50" cy="140" r="8" fill="#fef08a" opacity="0.3" />
          <circle cx="120" cy="315" r="7" fill="#fef08a" opacity="0.25" />
        </g>

        <!-- Beautiful Complete Fairy Seated Gracefully on the Crescent Moon -->
        <!-- Complete body visible: Head, face, hair, body, hands, legs, feet, fluttering wings & magic wand -->
        <g class="seated-fairy-group" id="seatedFairy">

          <!-- Delicate Wings Fluttering Softly while Seated -->
          <g class="fairy-wings-container">
            <!-- Upper Left Wing -->
            <g class="fairy-wing wing-upper-left wing-group-left">
              <path d="M 125 145 C 95 105, 55 70, 30 75 C 20 90, 40 135, 115 155 Z" fill="url(#wingGradUpper)" filter="url(#fairyGlow)" />
              <path d="M 120 148 C 95 118, 65 92, 45 92 C 40 100, 55 130, 115 152 Z" fill="#ffffff" opacity="0.45" />
            </g>
            <!-- Lower Left Wing -->
            <g class="fairy-wing wing-lower-left">
              <path d="M 122 155 C 90 150, 50 170, 40 190 C 45 205, 75 210, 118 165 Z" fill="url(#wingGradLower)" filter="url(#fairyGlow)" />
            </g>
            <!-- Upper Right Wing -->
            <g class="fairy-wing wing-upper-right wing-group-right">
              <path d="M 135 140 C 120 95, 95 55, 65 55 C 50 65, 70 115, 130 150 Z" fill="url(#wingGradUpper)" filter="url(#fairyGlow)" />
              <path d="M 130 142 C 115 108, 95 78, 75 75" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.65" />
              <path d="M 115 120 C 95 105, 80 95, 70 95" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.5" />
            </g>
            <!-- Lower Right Wing -->
            <g class="fairy-wing wing-lower-right">
              <path d="M 132 155 C 110 165, 75 195, 65 215 C 75 228, 100 220, 130 168 Z" fill="url(#wingGradLower)" opacity="0.92" />
            </g>
          </g>

          <!-- Flowing Golden Hair (Back Cascading Curls) -->
          <g class="fairy-hair-back">
            <path d="M 148 115 C 130 125, 110 145, 105 175 C 102 190, 108 200, 115 205 C 112 190, 118 165, 135 140 Z" fill="url(#hairGrad)" opacity="0.95" />
            <path d="M 152 118 C 138 135, 125 155, 120 185 C 125 170, 135 150, 150 135 Z" fill="#fef08a" opacity="0.85" />
          </g>

          <!-- Complete Legs and Feet (Fully Visible, Dangling Gracefully from Moon Cradle) -->
          <g class="fairy-legs-and-feet">
            <!-- Left Leg (Background Leg) -->
            <path d="M 145 190 C 158 195, 178 198, 185 205 C 190 215, 188 238, 185 260 C 183 268, 180 274, 178 278" fill="none" stroke="url(#skinGrad)" stroke-width="11" stroke-linecap="round" />
            <!-- Left Fairy Slipper & Foot with Ribbon Sparkle -->
            <g class="fairy-foot-left" transform="translate(177, 276)">
              <path d="M 1 0 C 3 6, 7 12, 12 15 C 8 16, 2 14, -2 10 C -4 6, -2 2, 1 0 Z" fill="#c084fc" />
              <circle cx="10" cy="14" r="2.2" fill="#facc15" />
            </g>

            <!-- Right Leg (Foreground Leg) Seated Naturally on Crescent -->
            <path d="M 138 185 C 152 188, 175 190, 192 195" fill="none" stroke="url(#skinGrad)" stroke-width="13" stroke-linecap="round" />
            <path d="M 192 195 C 200 205, 198 230, 196 252 C 195 262, 194 270, 195 274" fill="none" stroke="url(#skinGrad)" stroke-width="11" stroke-linecap="round" />
            <!-- Right Fairy Slipper & Foot with Star Sparkle -->
            <g class="fairy-foot-right" transform="translate(195, 272)">
              <path d="M 0 0 C 3 8, 9 14, 16 16 C 11 18, 3 16, -2 11 C -4 7, -2 2, 0 0 Z" fill="#a855f7" />
              <circle cx="14" cy="15" r="2.5" fill="#facc15" />
              <path d="M -1 4 C 3 6, 6 6, 10 4" fill="none" stroke="#fde047" stroke-width="1.2" />
            </g>
          </g>

          <!-- Fairy Gown / Dress (Bodice & Petal Skirt) -->
          <g class="fairy-gown">
            <path d="M 142 135 C 132 145, 130 162, 132 182 C 140 186, 155 186, 162 180 C 160 162, 158 145, 150 135 Z" fill="url(#fairyDressGrad)" filter="url(#fairyGlow)" />
            <path d="M 130 178 C 122 195, 135 212, 155 210 C 172 208, 178 198, 175 180 C 162 186, 142 185, 130 178 Z" fill="url(#fairyDressGrad)" />
            <path d="M 138 180 C 135 200, 150 216, 168 206 C 175 198, 170 185, 162 180 Z" fill="#e879f9" opacity="0.85" />
            <!-- Star Accents on Dress -->
            <circle cx="146" cy="178" r="3" fill="#fef08a" />
            <circle cx="152" cy="180" r="2" fill="#ffffff" />
          </g>

          <!-- Left Arm & Hand (Resting Gracefully on Moon) -->
          <g class="fairy-arm-left">
            <path d="M 140 142 C 130 152, 120 165, 114 178" fill="none" stroke="url(#skinGrad)" stroke-width="8" stroke-linecap="round" />
            <path d="M 114 178 C 110 182, 104 184, 98 183 C 98 180, 104 176, 110 174 Z" fill="url(#skinGrad)" />
          </g>

          <!-- Head, Neck, Face & Hair -->
          <g class="fairy-head-group">
            <path d="M 146 128 L 148 136 L 153 135 L 151 127 Z" fill="url(#skinGrad)" />
            <path d="M 148 110 C 146 100, 156 90, 166 94 C 174 98, 176 108, 172 118 C 168 126, 156 126, 150 120 C 148 116, 148 113, 148 110 Z" fill="url(#skinGrad)" />
            <!-- Serene Profile Facial Details -->
            <path d="M 162 110 C 164 113, 168 113, 170 110" fill="none" stroke="#7e22ce" stroke-width="1.4" stroke-linecap="round" />
            <line x1="168" y1="112" x2="171" y2="114" stroke="#7e22ce" stroke-width="1.2" stroke-linecap="round" />
            <path d="M 161 106 C 164 104, 168 104, 171 106" fill="none" stroke="#a16207" stroke-width="1.1" stroke-linecap="round" />
            <path d="M 172 112 C 174 114, 174 116, 171 117" fill="none" stroke="#fda4af" stroke-width="1.1" stroke-linecap="round" />
            <path d="M 165 120 C 167 122, 170 121, 172 119" fill="none" stroke="#e11d48" stroke-width="1.3" stroke-linecap="round" />
            <ellipse cx="163" cy="116" rx="4" ry="2.5" fill="#fb7185" opacity="0.6" />

            <!-- Front Hair Curls -->
            <g class="fairy-hair-front">
              <path d="M 152 94 C 160 88, 172 90, 174 98 C 168 96, 158 98, 152 104 Z" fill="url(#hairGrad)" />
              <path d="M 150 98 C 158 102, 160 112, 158 122 C 154 115, 152 108, 150 98 Z" fill="url(#hairGrad)" />
              <path d="M 148 94 C 142 98, 138 108, 140 120 C 142 135, 138 148, 134 160 C 130 148, 134 130, 142 115 Z" fill="url(#hairGrad)" />
            </g>

            <!-- Celestial Star Tiara -->
            <g class="fairy-tiara" transform="translate(158, 92)">
              <path d="M -8 4 L -4 0 L 0 -5 L 4 0 L 8 4 Z" fill="#fde047" stroke="#ca8a04" stroke-width="0.8" />
              <circle cx="0" cy="-5" r="2.2" fill="#ffffff" />
            </g>
          </g>

          <!-- Right Arm & Magic Wand Raised Forward -->
          <g class="fairy-arm-and-wand">
            <path d="M 152 138 C 162 142, 176 142, 185 138" fill="none" stroke="url(#skinGrad)" stroke-width="8" stroke-linecap="round" />
            <path d="M 185 138 C 192 134, 200 130, 206 124" fill="none" stroke="url(#skinGrad)" stroke-width="7.5" stroke-linecap="round" />
            <ellipse cx="207" cy="123" rx="4.5" ry="4" fill="url(#skinGrad)" />

            <!-- Magic Wand with Glowing Star Tip -->
            <g class="fairy-magic-wand fairy-wand-group" id="fairyMagicWand">
              <line x1="198" y1="135" x2="242" y2="82" stroke="#fde047" stroke-width="3.2" stroke-linecap="round" />
              <line x1="200" y1="133" x2="240" y2="84" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />

              <!-- Wand Star Tip (Glowing Celestial Star) -->
              <g class="wand-star-tip" id="wandStarTip" transform="translate(242, 82)">
                <path d="M 0 -15 L 4 -4 L 15 0 L 4 4 L 0 15 L -4 4 L -15 0 L -4 -4 Z" fill="#facc15" filter="url(#starGlowFilter)" />
                <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#ffffff" />
                <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
                <circle cx="-5" cy="-5" r="1.5" fill="#ffffff" />
                <circle cx="5" cy="5" r="1.5" fill="#ffffff" />
              </g>
            </g>
          </g>

        </g>
      </svg>

      <!-- Glowing Magical Beam & Particles Emerging from the Magic Wand -->
      <div class="wand-magic-beam" id="wandMagicBeam">
        <span class="magic-sparkle spk-1">✨</span>
        <span class="magic-sparkle spk-2">✦</span>
        <span class="magic-sparkle spk-3">✧</span>
        <span class="magic-sparkle spk-4">✨</span>
        <span class="magic-sparkle spk-5">✦</span>
      </div>
    </div>

    <!-- Wordmark & Tagline Revealed by Wand Magic -->
    <div class="pretwin-intro-branding" id="introBrandText">
      <div class="pretwin-intro-wordmark" id="introWordmark">PreTwin <span class="intro-ai-badge">AI</span></div>
      <div class="pretwin-intro-tagline" id="introTagline">Your Future. Your Style. Your Twin.</div>
    </div>

  </div>
</div>

<script>
/**
 * PreTwin Magical Fairy Sitting on Crescent Moon Startup Animation Controller
 * Sequence:
 *   1. Fade in dreamy night sky with stars
 *   2. Crescent half-moon appears glowing
 *   3. Complete fairy seated on crescent moon appears
 *   4. Wings flutter gently while fairy stays seated (no circular flights)
 *   5. Magic wand star pulses and releases sparkling beam toward center
 *   6. Reveals PreTwin AI wordmark
 *   7. Reveals highlighted tagline: "Your Future. Your Style. Your Twin."
 *   8. Smooth dissolve transition to login / landing page
 */
(function() {
  const INTRO_STORAGE_KEY = 'pretwin_intro_played_v4';
  const overlay = document.getElementById('pretwinStartupIntro');
  if (!overlay) return;

  // Reduced motion check
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const introSeen = sessionStorage.getItem(INTRO_STORAGE_KEY);
  const isLoginPage = ['/login', '/signin', '/sign-in', '/sign_in', '/register', '/signup', '/sign-up', '/auth'].some(p => window.location.pathname.startsWith(p));
  const isHomePage = window.location.pathname === '/' || window.location.pathname === '';

  // Never play startup animation on login or register screens
  if (isLoginPage) {
    overlay.style.display = 'none';
    overlay.style.pointerEvents = 'none';
    return;
  }

  // If already seen in this session or prefers reduced motion, bypass immediately
  if (introSeen || prefersReducedMotion) {
    overlay.style.display = 'none';
    overlay.style.pointerEvents = 'none';
    return;
  }

  // Only play on fresh visits to homepage
  if (!isHomePage) {
    overlay.style.display = 'none';
    overlay.style.pointerEvents = 'none';
    return;
  }

  // Show full-screen overlay
  overlay.style.display = 'flex';
  overlay.setAttribute('aria-hidden', 'false');

  // Step 1: Sky, stars, and crescent moon with seated fairy appear (0.1s)
  setTimeout(() => {
    overlay.classList.add('stage-moon-appear');
  }, 100);

  // Step 2: Wings start gentle fluttering motion while fairy remains seated (0.6s)
  setTimeout(() => {
    overlay.classList.add('stage-flutter');
  }, 600);

  // Step 3: Magic wand glows and raises beam towards center (1.8s)
  setTimeout(() => {
    overlay.classList.add('stage-wand');
  }, 1800);

  // Step 4: Magical beam travels across screen (2.0s)
  setTimeout(() => {
    overlay.classList.add('stage-beam');
  }, 2000);

  // Step 5: Magical reveal of "PreTwin AI" wordmark (2.6s)
  setTimeout(() => {
    overlay.classList.add('stage-reveal');
  }, 2600);

  // Step 6: Reveal prominently highlighted tagline (3.4s)
  setTimeout(() => {
    overlay.classList.add('stage-tagline');
  }, 3400);

  // Step 7: Smooth transition to login or shopping catalog (5.2s)
  setTimeout(() => {
    finishStartupIntro();
  }, 5200);
})();

function skipStartupIntro() {
  finishStartupIntro(true);
}

function finishStartupIntro(immediate = false) {
  const overlay = document.getElementById('pretwinStartupIntro');
  if (!overlay || overlay.dataset.finished === '1') return;
  overlay.dataset.finished = '1';
  sessionStorage.setItem('pretwin_intro_played_v4', '1');

  const isLoginPage = window.location.pathname === '/login';
  const isHomePage = window.location.pathname === '/' || window.location.pathname === '';

  if (immediate) {
    overlay.style.transition = 'opacity 0.2s ease';
    overlay.style.opacity = '0';
    overlay.style.pointerEvents = 'none';
    setTimeout(() => {
      overlay.style.display = 'none';
      overlay.setAttribute('aria-hidden', 'true');
      const userLoggedIn = window.PRETWIN_IS_AUTHENTICATED || (window.currentUser && window.currentUser.id);
      if (isHomePage && !userLoggedIn) {
        window.location.href = '/login';
      }
    }, 200);
    return;
  }

  // Smooth dissolve transition
  overlay.classList.add('stage-fadeout');
  overlay.style.pointerEvents = 'none';
  setTimeout(() => {
    overlay.style.display = 'none';
    overlay.setAttribute('aria-hidden', 'true');
    const userLoggedIn = window.PRETWIN_IS_AUTHENTICATED || (window.currentUser && window.currentUser.id);
    if (isHomePage && !userLoggedIn) {
      window.location.href = '/login';
    }
  }, 750);
}
</script>
