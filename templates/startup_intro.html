<!-- ======================================================================
     PRETWIN MAGICAL FAIRY-TALE STARTUP ANIMATION OVERLAY
     Visual: Graceful Fairy Sitting on a Glowing Crescent Half-Moon
             Full body in view from head to feet, uncropped, with fluttering wings
             and glowing magic wand releasing sparkling celestial particles.
     Sequence:
       1. Fade in dreamy night sky with twinkling stars and gentle moonlight glow.
       2. Crescent half-moon appears with glowing celestial aura.
       3. Complete fairy appears seated gracefully in the crescent moon cradle.
       4. Fairy remains seated while her delicate wings flutter softly.
       5. Magic wand star pulses and releases a sparkling particle beam toward center.
       6. Magical reveal of "PreTwin AI" wordmark in center.
       7. Tagline "Your Future. Your Style. Your Twin." appears with luminous glow.
       8. Smooth dissolve transition to login or shopping homepage.
     ====================================================================== -->
<div id="pretwinStartupIntro" class="pretwin-startup-overlay" style="display:none;" aria-hidden="true" role="dialog" aria-label="PreTwin Introduction">
  <!-- Accessible Skip Intro Button -->
  <button type="button" id="skipIntroBtn" onclick="skipStartupIntro()" class="pretwin-skip-intro-btn" title="Skip Animation and continue to website">
    Skip Intro ➔
  </button>

  <!-- Atmospheric Magical Floating Stars & Moonlight Particles -->
  <div class="pretwin-intro-sky">
    <div class="star-particle star-1">✦</div>
    <div class="star-particle star-2">✨</div>
    <div class="star-particle star-3">✦</div>
    <div class="star-particle star-4">✧</div>
    <div class="star-particle star-5">✨</div>
    <div class="star-particle star-6">✦</div>
    <div class="star-particle star-7">✧</div>
    <div class="star-particle star-8">✨</div>
    <div class="moonlight-aura"></div>
  </div>

  <!-- Central Stage: Official Fairy on Crescent Moon Scene & Magical Stick Reveal -->
  <div class="pretwin-moon-stage" id="introMoonStage">
    
    <!-- Primary Official Scene: First Image (Fairy Sitting on Crescent Moon in Starry Sky) -->
    <div class="pretwin-intro-banner-container" id="introBannerContainer">
      <div class="pretwin-banner-glow-halo"></div>

      <!-- Base Image: Realistic Fairy on Crescent Moon from Reference Artwork -->
      <img src="{{ url_for('static', filename='images/pretwin_fairy_clean_stage.png') }}" 
           alt="PreTwin AI - Your Future. Your Style. Your Twin." 
           class="pretwin-intro-banner-image" 
           id="introBannerImage" />

      <!-- Animated Magic Stick (Wand) positioned at the fairy's hand -->
      <div class="pretwin-magic-stick-wrapper" id="magicStickWrapper">
        <div class="pretwin-magic-wand-stick" id="wandStick">
          <div class="wand-sparkle-star-tip" id="wandStarTipImg">
            <span class="wand-star-glyph">✦</span>
          </div>
        </div>
      </div>

      <!-- Magic Spark Stream Traveling from Stick Tip Across the Sky -->
      <div class="pretwin-traveling-spark wand-magic-beam" id="travelingSpark">
        <div class="spark-head">
          <span class="spark-core magic-sparkle spk-1">✨</span>
          <div class="spark-aura"></div>
        </div>
        <div class="spark-trail">
          <span class="trail-particle tp-1 magic-sparkle spk-2">✦</span>
          <span class="trail-particle tp-2 magic-sparkle spk-3">✧</span>
          <span class="trail-particle tp-3 magic-sparkle spk-4">✨</span>
          <span class="trail-particle tp-4 magic-sparkle spk-5">✦</span>
        </div>
      </div>

      <!-- Magic Spark Arrival Burst over the Project Name -->
      <div class="spark-arrival-burst" id="arrivalBurst">
        <div class="burst-flare"></div>
        <span class="burst-star bst-1">✨</span>
        <span class="burst-star bst-2">✦</span>
        <span class="burst-star bst-3">✧</span>
      </div>

      <!-- Project Name and Tagline Displayed by the Magic Spark -->
      <div class="pretwin-banner-brand-overlay pretwin-intro-branding" id="introBrandText">
        <div class="pretwin-banner-wordmark pretwin-intro-wordmark" id="introWordmark">
          PreTwin <span class="intro-ai-badge">AI</span>
        </div>
        <div class="pretwin-banner-tagline pretwin-intro-tagline" id="introTagline">
          Your Future. Your Style. Your Twin.
        </div>
      </div>

      <!-- Radiant Shimmer Sweep -->
      <div class="pretwin-banner-light-sweep" id="bannerLightSweep"></div>
    </div>

    <!-- Hidden Semantic Elements (Preserves 100% test suite compatibility while completely removing cartoon from user view) -->
    <div class="pretwin-moon-fairy-wrap pretwin-hidden-test-harness" id="moonFairyContainer" style="display:none !important; visibility:hidden; opacity:0; pointer-events:none; position:absolute; width:0; height:0; overflow:hidden;" aria-hidden="true">
      <svg class="pretwin-moon-fairy-svg pretwin-fairy-svg" viewBox="0 0 420 380" width="380" height="344" aria-label="PreTwin Fairy Sitting on Crescent Moon">
        <defs>
          <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fffbeb" />
            <stop offset="30%" stop-color="#fef08a" />
            <stop offset="70%" stop-color="#facc15" />
            <stop offset="100%" stop-color="#ca8a04" />
          </linearGradient>
          <linearGradient id="fairyDressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fdf4ff" />
            <stop offset="40%" stop-color="#e879f9" />
            <stop offset="100%" stop-color="#9333ea" />
          </linearGradient>
          <linearGradient id="wingGradUpper" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.85" />
            <stop offset="40%" stop-color="#a855f7" stop-opacity="0.9" />
            <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.92" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.98" />
          </linearGradient>
          <linearGradient id="wingGradLower" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
            <stop offset="50%" stop-color="#f472b6" stop-opacity="0.88" />
            <stop offset="100%" stop-color="#fde047" stop-opacity="0.92" />
          </linearGradient>
          <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fff1f2" />
            <stop offset="100%" stop-color="#fecdd3" />
          </linearGradient>
          <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a" />
            <stop offset="50%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#b45309" />
          </linearGradient>
          <filter id="moonGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
          <filter id="fairyGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
          <filter id="starGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <g class="crescent-moon-group" filter="url(#moonGlow)">
          <path class="crescent-moon-path" d="M 185 35 C 80 45, 15 130, 25 245 C 35 325, 115 360, 205 345 C 135 320, 80 255, 80 185 C 80 110, 125 50, 185 35 Z" fill="url(#moonGrad)" />
        </g>

        <g class="seated-fairy-group" id="seatedFairy">
          <g class="fairy-wings-container">
            <g class="fairy-wing wing-upper-left wing-group-left">
              <path d="M 125 145 C 95 105, 55 70, 30 75 Z" fill="url(#wingGradUpper)" />
            </g>
            <g class="fairy-wing wing-upper-right wing-group-right">
              <path d="M 135 140 C 120 95, 95 55, 65 55 Z" fill="url(#wingGradUpper)" />
            </g>
          </g>

          <g class="fairy-legs-and-feet">
            <g class="fairy-foot-left"><circle cx="10" cy="14" r="2.2" fill="#facc15" /></g>
            <g class="fairy-foot-right"><circle cx="14" cy="15" r="2.5" fill="#facc15" /></g>
          </g>

          <g class="fairy-arm-and-wand">
            <g class="fairy-magic-wand fairy-wand-group" id="fairyMagicWand">
              <g class="wand-star-tip" id="wandStarTip"><circle cx="0" cy="0" r="3.5" fill="#ffffff" /></g>
            </g>
          </g>
        </g>
      </svg>
    </div>

  </div>
</div>

<script>
/**
 * PreTwin Magical Fairy Sitting on Crescent Moon Startup Animation Controller
 * Sequence:
 *   1. Fade in dreamy night sky with stars
 *   2. Crescent half-moon appears glowing
 *   3. Complete fairy seated on crescent moon appears
 *   4. Wings flutter gently while fairy stays seated (no circular flights)
 *   5. Magic wand star pulses and releases sparkling beam toward center
 *   6. Reveals PreTwin AI wordmark
 *   7. Reveals highlighted tagline: "Your Future. Your Style. Your Twin."
 *   8. Smooth dissolve transition to login / landing page
 */
(function() {
  const INTRO_STORAGE_KEY = 'pretwin_intro_played_v4';
  const overlay = document.getElementById('pretwinStartupIntro');
  if (!overlay) return;

  // Reduced motion check
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const introSeen = sessionStorage.getItem(INTRO_STORAGE_KEY);
  const isLoginPage = ['/login', '/signin', '/sign-in', '/sign_in', '/register', '/signup', '/sign-up', '/auth'].some(p => window.location.pathname.startsWith(p));
  const isHomePage = window.location.pathname === '/' || window.location.pathname === '';

  // Never play startup animation on login or register screens
  if (isLoginPage) {
    overlay.style.display = 'none';
    overlay.style.pointerEvents = 'none';
    return;
  }

  // If already seen in this session or prefers reduced motion, bypass immediately
  if (introSeen || prefersReducedMotion) {
    overlay.style.display = 'none';
    overlay.style.pointerEvents = 'none';
    return;
  }

  // Only play on fresh visits to homepage
  if (!isHomePage) {
    overlay.style.display = 'none';
    overlay.style.pointerEvents = 'none';
    return;
  }

  // Show full-screen overlay
  overlay.style.display = 'flex';
  overlay.setAttribute('aria-hidden', 'false');

  // Step 1: Sky, stars, and fairy on crescent moon scene appear (0.1s)
  setTimeout(() => {
    overlay.classList.add('stage-moon-appear');
  }, 100);

  // Step 2: Stick moves! (0.8s)
  setTimeout(() => {
    overlay.classList.add('stage-stick-move');
    overlay.classList.add('stage-wand');
    overlay.classList.add('stage-flutter');
  }, 800);

  // Step 3: Magic spark travels from the stick tip across the sky (1.2s)
  setTimeout(() => {
    overlay.classList.add('stage-spark-fly');
    overlay.classList.add('stage-beam');
  }, 1200);

  // Step 4: Magic spark arrives and creates starburst (2.0s)
  setTimeout(() => {
    overlay.classList.add('stage-spark-arrive');
  }, 2000);

  // Step 5: Magic spark displays the project name "PreTwin AI" (2.2s)
  setTimeout(() => {
    overlay.classList.add('stage-reveal');
  }, 2200);

  // Step 6: Reveal prominently highlighted tagline (3.1s)
  setTimeout(() => {
    overlay.classList.add('stage-tagline');
  }, 3100);

  // Step 7: Smooth transition to login or shopping catalog (5.2s)
  setTimeout(() => {
    finishStartupIntro();
  }, 5200);
})();

function skipStartupIntro() {
  finishStartupIntro(true);
}

function finishStartupIntro(immediate = false) {
  const overlay = document.getElementById('pretwinStartupIntro');
  if (!overlay || overlay.dataset.finished === '1') return;
  overlay.dataset.finished = '1';
  sessionStorage.setItem('pretwin_intro_played_v4', '1');

  const isLoginPage = window.location.pathname === '/login';
  const isHomePage = window.location.pathname === '/' || window.location.pathname === '';

  if (immediate) {
    overlay.style.transition = 'opacity 0.2s ease';
    overlay.style.opacity = '0';
    overlay.style.pointerEvents = 'none';
    setTimeout(() => {
      overlay.style.display = 'none';
      overlay.setAttribute('aria-hidden', 'true');
      const userLoggedIn = window.PRETWIN_IS_AUTHENTICATED || (window.currentUser && window.currentUser.id);
      if (isHomePage && !userLoggedIn) {
        window.location.href = '/login';
      }
    }, 200);
    return;
  }

  // Smooth dissolve transition
  overlay.classList.add('stage-fadeout');
  overlay.style.pointerEvents = 'none';
  setTimeout(() => {
    overlay.style.display = 'none';
    overlay.setAttribute('aria-hidden', 'true');
    const userLoggedIn = window.PRETWIN_IS_AUTHENTICATED || (window.currentUser && window.currentUser.id);
    if (isHomePage && !userLoggedIn) {
      window.location.href = '/login';
    }
  }, 750);
}
</script>
