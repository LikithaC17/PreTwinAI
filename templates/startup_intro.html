<!-- ======================================================================
     PRETWIN AI INTRO ANIMATION OVERLAY
     Sequence:
       1. Animated Logo First: PreTwin AI project logo emerges at center-left with smooth scale-up & glow
       2. Side-by-Side Title Reveal: Exact project name "PreTwin AI" reveals immediately to the right
          on the same horizontal line with magical sparkle effect
       3. Tagline: "Your Future. Your Style. Your Twin." appears underneath
       4. Fairy & Magic Wand Sequence: Full-body fairy flies gracefully around intro area, settles,
          waves wand emitting sparkles from wand tip that briefly highlight the logo & title
       5. Stationary Final Screen & Enter Button: Intro freezes in place, "Enter" button appears
          beneath branding; transitions to homepage on click
     ====================================================================== -->
<div id="pretwinStartupIntro" class="pretwin-startup-overlay" style="display:none;" aria-hidden="true" role="dialog" aria-label="PreTwin Introduction">
  <!-- Accessible Skip Intro Button -->
  <button type="button" id="skipIntroBtn" onclick="skipStartupIntro()" class="pretwin-skip-intro-btn" title="Skip Animation and continue">
    Skip Intro ➔
  </button>

  <!-- Atmospheric Magical Floating Stars Background -->
  <div class="pretwin-intro-sky">
    <div class="star-particle star-1">✦</div>
    <div class="star-particle star-2">✨</div>
    <div class="star-particle star-3">✦</div>
    <div class="star-particle star-4">✧</div>
    <div class="star-particle star-5">✨</div>
    <div class="star-particle star-6">✦</div>
    <div class="star-particle star-7">✧</div>
    <div class="star-particle star-8">✨</div>
  </div>

  <!-- Soaring Flying-Wing Logo Stage Container -->
  <div class="pretwin-flight-stage" id="introFlightStage">
    
    <!-- MAIN HERO BRANDING: Side-by-Side Logo (Left) and Title (Right) on Same Horizontal Line -->
    <div class="pretwin-intro-branding pretwin-side-by-side-branding" id="introBrandText">
      
      <!-- 1. The PreTwin Project Logo (Animates First) -->
      <div class="pretwin-intro-logo-box" id="introLogoBox">
        <img src="{{ url_for('static', filename='images/pretwin-icon.svg') }}" 
             alt="PreTwin AI Logo" 
             class="pretwin-intro-icon-logo" 
             id="introIconLogo" />
        <!-- Preserved asset reference for backward compatibility -->
        <img src="{{ url_for('static', filename='images/pretwin-logo.svg') }}" 
             alt="PreTwin AI Official Logo" 
             class="pretwin-intro-official-logo" 
             id="introOfficialLogo" 
             style="display:none;" />
      </div>

      <!-- 2. The Project Name: PreTwin AI (Revealed Immediately to Right of Logo) -->
      <div class="pretwin-intro-title-box" id="introTitleBox">
        <div class="pretwin-intro-wordmark" id="introWordmark">
          PreTwin <span class="intro-ai-badge">AI</span>
        </div>
      </div>

    </div>

    <!-- Prominently Highlighted Tagline directly beneath the horizontal branding -->
    <div class="pretwin-intro-tagline-wrap" id="introTaglineWrap">
      <div class="pretwin-intro-tagline" id="introTagline">
        Your Future. Your Style. Your Twin.
      </div>
    </div>

    <!-- Magical Enter Button (Appears beneath branding after reveal completes) -->
    <div class="pretwin-intro-enter-wrap" id="introEnterWrap">
      <button type="button" 
              id="enterWebsiteBtn" 
              onclick="finishStartupIntro()" 
              class="pretwin-enter-intro-btn" 
              title="Enter PreTwin AI">
        <span class="enter-btn-text">Enter</span>
        <span class="enter-btn-icon">➔</span>
        <span class="enter-btn-sparkle">✨</span>
      </button>
    </div>

    <!-- Full-Body Flying Fairy Character with Wings & Magic Wand (Enters after side-by-side title reveal) -->
    <div class="pretwin-flying-emblem-wrap" id="introFlightEmblem">
      <svg class="pretwin-fairy-svg" viewBox="0 0 140 140" width="150" height="150" aria-label="PreTwin Fairy Logo">
        <defs>
          <linearGradient id="introWingGradUpper" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#6d28d9" />
            <stop offset="40%" stop-color="#8b5cf6" />
            <stop offset="80%" stop-color="#c4b5fd" />
            <stop offset="100%" stop-color="#ffffff" />
          </linearGradient>
          <linearGradient id="introWingGradLower" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563eb" />
            <stop offset="50%" stop-color="#60a5fa" />
            <stop offset="100%" stop-color="#bae6fd" />
          </linearGradient>
          <linearGradient id="fairyDressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fdf4ff" />
            <stop offset="35%" stop-color="#e879f9" />
            <stop offset="70%" stop-color="#a855f7" />
            <stop offset="100%" stop-color="#6d28d9" />
          </linearGradient>
          <linearGradient id="fairySkinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#fce7f3" />
          </linearGradient>
          <linearGradient id="fairyHairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a" />
            <stop offset="50%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#b45309" />
          </linearGradient>
          <linearGradient id="wandRodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a" />
            <stop offset="50%" stop-color="#c084fc" />
            <stop offset="100%" stop-color="#7c3aed" />
          </linearGradient>
          <filter id="introSoftGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- Soft Stardust Flight Trail Stream -->
        <path d="M 15 95 C 28 94, 45 84, 58 70 C 65 58, 70 48, 78 38" fill="none" stroke="#d8b4fe" stroke-width="2.5" stroke-dasharray="4,4" opacity="0.75" />

        <!-- Left Translucent Wing with Flutter Motion -->
        <g class="wing-group-left">
          <path d="M 62 58 C 45 32, 22 18, 4 18 C 2 34, 14 58, 44 68 Z" fill="url(#introWingGradUpper)" filter="url(#introSoftGlow)" opacity="0.9" />
          <path d="M 60 62 C 46 50, 28 38, 12 42 C 14 52, 24 64, 46 68 Z" fill="url(#introWingGradLower)" opacity="0.82" />
          <path d="M 44 68 C 28 50, 16 34, 8 22" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6" />
        </g>

        <!-- Right Translucent Wing with Flutter Motion -->
        <g class="wing-group-right">
          <path d="M 78 56 C 96 30, 120 18, 136 19 C 136 35, 124 58, 94 68 Z" fill="url(#introWingGradUpper)" filter="url(#introSoftGlow)" opacity="0.95" />
          <path d="M 80 61 C 94 50, 112 38, 128 42 C 126 52, 116 64, 94 70 Z" fill="url(#introWingGradLower)" opacity="0.82" />
          <path d="M 94 68 C 110 50, 122 34, 130 23" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6" />
        </g>

        <!-- Flowing Golden Hair behind Head -->
        <path d="M 67 42 C 61 44, 56 50, 58 60 C 60 55, 63 48, 68 46 Z" fill="url(#fairyHairGrad)" />

        <!-- Fairy Head with Star Tiara and Facial Profile -->
        <circle cx="70" cy="46" r="6" fill="url(#fairySkinGrad)" filter="url(#introSoftGlow)" />
        <circle cx="71" cy="40.5" r="1.8" fill="#facc15" />
        <circle cx="72.5" cy="45" r="0.9" fill="#6d28d9" opacity="0.8" />
        <path d="M 73 48 Q 74 49 75 48.5" fill="none" stroke="#ec4899" stroke-width="0.8" stroke-linecap="round" />

        <!-- Right Arm gracefully arched in flight -->
        <path d="M 68 53 Q 60 48 54 42" fill="none" stroke="url(#fairySkinGrad)" stroke-width="2.6" stroke-linecap="round" />

        <!-- Gown and Torso (Graceful fluttering body silhouette) -->
        <path d="M 66 52 C 67 48, 73 48, 75 52 C 77 60, 75 68, 70 76 C 68 84, 63 94, 60 100 C 64 90, 69 80, 70 70 Z" fill="url(#fairyDressGrad)" filter="url(#introSoftGlow)" />
        <ellipse cx="70" cy="62" rx="4.2" ry="1.5" fill="#facc15" opacity="0.95" />

        <!-- Full Legs and Delicate Pointed Slippers -->
        <path d="M 63 94 Q 62 106 60 114" fill="none" stroke="url(#fairySkinGrad)" stroke-width="2.2" stroke-linecap="round" />
        <ellipse cx="59.5" cy="114.5" rx="2.8" ry="1.4" fill="#facc15" transform="rotate(-15, 59.5, 114.5)" />
        <path d="M 67 92 Q 70 104 73 112" fill="none" stroke="url(#fairySkinGrad)" stroke-width="2.2" stroke-linecap="round" />
        <ellipse cx="73.5" cy="112.5" rx="2.8" ry="1.4" fill="#facc15" transform="rotate(22, 73.5, 112.5)" />

        <!-- Left Arm extending forward holding the Magic Wand -->
        <path d="M 72 53 Q 80 58 87 50" fill="none" stroke="url(#fairySkinGrad)" stroke-width="2.6" stroke-linecap="round" />
        <circle cx="87" cy="50" r="2.2" fill="url(#fairySkinGrad)" />

        <!-- Single Magic Wand (Firmly held in hand; moves with her arm) -->
        <g class="fairy-wand-group" id="fairyWandGroup">
          <!-- Slender Wand Rod -->
          <line x1="85" y1="52" x2="112" y2="26" stroke="url(#wandRodGrad)" stroke-width="3" stroke-linecap="round" />
          
          <!-- Wand Star Tip with Glowing Star at 112, 26 -->
          <g class="wand-star-tip" id="wandStarTip" transform="translate(112, 26)">
            <path d="M 0 -10 L 2.8 -2.8 L 10 0 L 2.8 2.8 L 0 10 L -2.8 2.8 L -10 0 L -2.8 -2.8 Z" fill="#facc15" />
            <circle cx="0" cy="0" r="3.2" fill="#ffffff" />
            <circle cx="-3.5" cy="-4" r="1.2" fill="#ffffff" />
            <circle cx="4" cy="3.5" r="1.2" fill="#ffffff" />
          </g>
        </g>
      </svg>

      <!-- Glowing Magical Beam & Sparkles Emerging from the Wand Tip -->
      <div class="wand-magic-beam" id="wandMagicBeam">
        <span class="magic-sparkle spk-1">✨</span>
        <span class="magic-sparkle spk-2">✦</span>
        <span class="magic-sparkle spk-3">✧</span>
        <span class="magic-sparkle spk-4">✨</span>
        <span class="magic-sparkle spk-5">✦</span>
      </div>
    </div>

  </div>
</div>

<script>
/**
 * PreTwin AI Enhanced Startup Animation Controller
 * Sequence:
 *   1. Atmospheric starry background emerges (0.1s)
 *   2. Logo animates first with gentle scale-up and magical glow (0.1s - 1.3s)
 *   3. Project name "PreTwin AI" reveals immediately beside the logo on the right (1.3s - 2.2s)
 *   4. Tagline appears directly underneath (1.9s)
 *   5. Fairy enters, flies smoothly around intro area in circular path (2.4s - 5.0s)
 *   6. Fairy settles near top-right, waves wand producing sparkles that highlight the branding (5.0s - 6.0s)
 *   7. Intro freezes in place (flight & wand stop; logo + title remain stationary side-by-side) (6.2s)
 *   8. "Enter" button fades in below branding, waiting for user click (6.2s)
 *   9. User clicks Enter -> smooth transition into homepage
 */
(function() {
  const INTRO_STORAGE_KEY = 'pretwin_intro_played_v7';
  const overlay = document.getElementById('pretwinStartupIntro');
  if (!overlay) return;

  // Reduced motion check
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const introSeen = sessionStorage.getItem(INTRO_STORAGE_KEY);
  const isLoginPage = ['/login', '/signin', '/sign-in', '/sign_in', '/register', '/signup', '/sign-up', '/auth'].some(p => window.location.pathname.startsWith(p));
  const isHomePage = window.location.pathname === '/' || window.location.pathname === '';

  // Never play startup animation on login or register screens
  if (isLoginPage) {
    overlay.style.display = 'none';
    overlay.style.pointerEvents = 'none';
    return;
  }

  // If already seen in this session or prefers reduced motion, bypass immediately
  if (introSeen || prefersReducedMotion) {
    overlay.style.display = 'none';
    overlay.style.pointerEvents = 'none';
    return;
  }

  // Only play on fresh visits to homepage
  if (!isHomePage) {
    overlay.style.display = 'none';
    overlay.style.pointerEvents = 'none';
    return;
  }

  // Show full-screen overlay
  overlay.style.display = 'flex';
  overlay.setAttribute('aria-hidden', 'false');

  // Step 1: Animate Logo First (0.1s - 1.3s)
  setTimeout(() => {
    overlay.classList.add('stage-logo-enter');
  }, 100);

  // Step 2: Reveal Project Name Beside Logo on Same Line (1.3s)
  setTimeout(() => {
    overlay.classList.add('stage-reveal');
  }, 1300);

  // Step 3: Reveal Tagline Underneath (1.9s)
  setTimeout(() => {
    overlay.classList.add('stage-tagline');
  }, 1900);

  // Step 4: Fairy enters and flies gracefully around intro area (2.4s - 5.0s)
  setTimeout(() => {
    overlay.classList.add('stage-flight');
  }, 2400);

  // Step 5: Fairy completes flight, settles, waves wand producing sparkles over branding (5.0s)
  setTimeout(() => {
    overlay.classList.add('stage-wand');
    overlay.classList.add('stage-beam');
    overlay.classList.add('stage-highlight');
  }, 5000);

  // Step 6: FREEZE intro & reveal Enter button (6.2s)
  // Flight & wand stop; logo + title remain stationary side-by-side; Enter button appears
  setTimeout(() => {
    overlay.classList.add('stage-freeze');
    overlay.classList.add('stage-ready');
    overlay.classList.add('stage-enter');
  }, 6200);

  // Keyboard accessibility: Enter or Space triggers entry once ready
  window.addEventListener('keydown', function handleIntroKeyPress(e) {
    if (overlay.style.display !== 'none' && overlay.classList.contains('stage-enter')) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        window.removeEventListener('keydown', handleIntroKeyPress);
        finishStartupIntro();
      }
    }
  });
})();

function skipStartupIntro() {
  finishStartupIntro(true);
}

function finishStartupIntro(immediate = false) {
  const overlay = document.getElementById('pretwinStartupIntro');
  if (!overlay || overlay.dataset.finished === '1') return;
  overlay.dataset.finished = '1';
  sessionStorage.setItem('pretwin_intro_played_v7', '1');

  const isLoginPage = window.location.pathname === '/login';
  const isHomePage = window.location.pathname === '/' || window.location.pathname === '';

  if (immediate) {
    overlay.style.transition = 'opacity 0.2s ease';
    overlay.style.opacity = '0';
    overlay.style.pointerEvents = 'none';
    setTimeout(() => {
      overlay.style.display = 'none';
      overlay.setAttribute('aria-hidden', 'true');
      const userLoggedIn = window.PRETWIN_IS_AUTHENTICATED || (window.currentUser && window.currentUser.id);
      if (isHomePage && !userLoggedIn) {
        window.location.href = '/login';
      }
    }, 200);
    return;
  }

  // Smooth dissolve transition to homepage
  overlay.classList.add('stage-fadeout');
  overlay.style.pointerEvents = 'none';
  setTimeout(() => {
    overlay.style.display = 'none';
    overlay.setAttribute('aria-hidden', 'true');
    const userLoggedIn = window.PRETWIN_IS_AUTHENTICATED || (window.currentUser && window.currentUser.id);
    if (isHomePage && !userLoggedIn) {
      window.location.href = '/login';
    }
  }, 650);
}
</script>
