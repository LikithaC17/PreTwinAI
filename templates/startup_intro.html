<!-- ======================================================================
     PRETWIN ORIGINAL STARTUP INTRO ANIMATION OVERLAY
     Stage 1: Enter & Fly ONE complete 360-degree circular orbit around center
     Stage 2: Winged emblem settles at center, points magic wand toward center
              and emits glowing beam sweeping across screen
     Stage 3: Magical left-to-right sparkling reveal of "PreTwin AI" wordmark
              and prominent tagline: "Your Future. Your Style. Your Twin."
     Stage 4: Enter button appears; smooth dissolve transition into homepage
     ====================================================================== -->
<div id="pretwinStartupIntro" class="pretwin-startup-overlay" style="display:none;" aria-hidden="true" role="dialog" aria-label="PreTwin Introduction">
  <!-- Accessible Skip Intro Button -->
  <button type="button" id="skipIntroBtn" onclick="skipStartupIntro()" class="pretwin-skip-intro-btn" title="Skip Animation and continue">
    Skip Intro ➔
  </button>

  <!-- Atmospheric Magical Floating Stars Background -->
  <div class="pretwin-intro-sky">
    <div class="star-particle star-1">✦</div>
    <div class="star-particle star-2">✨</div>
    <div class="star-particle star-3">✦</div>
    <div class="star-particle star-4">✧</div>
    <div class="star-particle star-5">✨</div>
    <div class="star-particle star-6">✦</div>
    <div class="star-particle star-7">✧</div>
    <div class="star-particle star-8">✨</div>
  </div>

  <!-- Soaring Flying-Wing Logo Stage Container -->
  <div class="pretwin-flight-stage">
    
    <!-- Flying Winged Character Emblem with Official Logo -->
    <div class="pretwin-flying-emblem-wrap" id="introFlightEmblem">
      <!-- Official PreTwin Project Brand Logo -->
      <div class="pretwin-intro-official-logo-wrap" id="introOfficialLogoWrap">
        <img src="{{ url_for('static', filename='images/pretwin-logo.svg') }}" 
             alt="PreTwin AI Official Logo" 
             class="pretwin-intro-official-logo" 
             id="introOfficialLogo" />
      </div>

      <svg class="pretwin-fairy-svg" viewBox="0 0 120 120" width="135" height="135" aria-label="PreTwin Fairy Logo">
        <defs>
          <linearGradient id="introWingGradUpper" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#6d28d9" />
            <stop offset="40%" stop-color="#8b5cf6" />
            <stop offset="80%" stop-color="#c4b5fd" />
            <stop offset="100%" stop-color="#ffffff" />
          </linearGradient>
          <linearGradient id="introWingGradLower" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563eb" />
            <stop offset="50%" stop-color="#60a5fa" />
            <stop offset="100%" stop-color="#bae6fd" />
          </linearGradient>
          <linearGradient id="wandRodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fdf4ff" />
            <stop offset="50%" stop-color="#c084fc" />
            <stop offset="100%" stop-color="#7c3aed" />
          </linearGradient>
          <filter id="introSoftGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- Soft Flight Trail Stream -->
        <path d="M 18 85 C 28 84, 42 76, 52 64 C 58 54, 62 44, 68 36" fill="none" stroke="#d8b4fe" stroke-width="2.5" stroke-dasharray="4,4" opacity="0.75" />

        <!-- Left Wing with Flutter Motion -->
        <g class="wing-group-left">
          <path d="M 52 52 C 38 30, 18 16, 2 16 C 0 30, 10 50, 36 60 Z" fill="url(#introWingGradUpper)" filter="url(#introSoftGlow)" />
          <path d="M 50 56 C 38 45, 24 34, 10 38 C 12 47, 20 58, 38 61 Z" fill="url(#introWingGradLower)" opacity="0.85" />
        </g>

        <!-- Right Wing with Flutter Motion -->
        <g class="wing-group-right">
          <path d="M 68 50 C 82 28, 102 16, 118 17 C 118 31, 108 51, 82 60 Z" fill="url(#introWingGradUpper)" filter="url(#introSoftGlow)" />
          <path d="M 70 55 C 82 44, 96 33, 110 38 C 108 47, 100 58, 82 62 Z" fill="url(#introWingGradLower)" opacity="0.85" />
        </g>

        <!-- Graceful Silhouette -->
        <path d="M 57 48 C 58 44, 62 44, 63 48 C 65 52, 64 58, 61 64 C 59 70, 56 77, 54 82 C 56 75, 58 68, 59 62 Z" fill="#ffffff" opacity="0.98" filter="url(#introSoftGlow)" />
        <circle cx="60" cy="42" r="5" fill="#ffffff" />

        <!-- Magic Wand (Raised to point at center) -->
        <g class="fairy-wand-group">
          <!-- Slender Wand Rod -->
          <line x1="62" y1="52" x2="88" y2="30" stroke="url(#wandRodGrad)" stroke-width="3" stroke-linecap="round" />
          
          <!-- Wand Star Tip with Glowing Star -->
          <g class="wand-star-tip" transform="translate(88, 30)">
            <path d="M 0 -9 L 2.5 -2.5 L 9 0 L 2.5 2.5 L 0 9 L -2.5 2.5 L -9 0 L -2.5 -2.5 Z" fill="#facc15" />
            <circle cx="0" cy="0" r="3" fill="#ffffff" />
            <!-- Star glints -->
            <circle cx="-3" cy="-4" r="1" fill="#ffffff" />
            <circle cx="4" cy="3" r="1" fill="#ffffff" />
          </g>
        </g>
      </svg>

      <!-- Glowing Magical Beam with Sparkling Particles Coming from the Wand -->
      <div class="wand-magic-beam" id="wandMagicBeam">
        <span class="magic-sparkle spk-1">✨</span>
        <span class="magic-sparkle spk-2">✦</span>
        <span class="magic-sparkle spk-3">✧</span>
        <span class="magic-sparkle spk-4">✨</span>
        <span class="magic-sparkle spk-5">✦</span>
      </div>
    </div>

    <!-- Wordmark & Tagline Revealed by Wand Magic -->
    <div class="pretwin-intro-branding" id="introBrandText">
      <div class="pretwin-intro-wordmark" id="introWordmark">PreTwin <span class="intro-ai-badge">AI</span></div>
      <div class="pretwin-intro-tagline" id="introTagline">Your Future. Your Style. Your Twin.</div>
    </div>

    <!-- Enter Website Button (Appears beneath branding after reveal completes) -->
    <div class="pretwin-intro-enter-wrap" id="introEnterWrap">
      <button type="button" 
              id="enterWebsiteBtn" 
              onclick="finishStartupIntro()" 
              class="pretwin-enter-intro-btn" 
              title="Enter PreTwin AI">
        <span class="enter-btn-text">Enter</span>
        <span class="enter-btn-icon">➔</span>
        <span class="enter-btn-sparkle">✨</span>
      </button>
    </div>
  </div>
</div>

<script>
/**
 * PreTwin Original Startup Animation Controller
 * Executes Stage 1 (360° circular orbit), Stage 2 (Wand reveal of PreTwin AI & Tagline), and Stage 3 (Transition to Website).
 */
(function() {
  const INTRO_STORAGE_KEY = 'pretwin_intro_played_v10';
  const overlay = document.getElementById('pretwinStartupIntro');
  if (!overlay) return;

  // Reduced motion check
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const introSeen = sessionStorage.getItem(INTRO_STORAGE_KEY);
  const isLoginPage = ['/login', '/signin', '/sign-in', '/sign_in', '/register', '/signup', '/sign-up', '/auth'].some(p => window.location.pathname.startsWith(p));
  const isHomePage = window.location.pathname === '/' || window.location.pathname === '';

  // Never play startup animation on login or register screens
  if (isLoginPage) {
    overlay.style.display = 'none';
    overlay.style.pointerEvents = 'none';
    return;
  }

  // If already seen or reduced motion, bypass immediately
  if (introSeen || prefersReducedMotion) {
    overlay.style.display = 'none';
    overlay.style.pointerEvents = 'none';
    return;
  }

  // Only play on fresh visits to homepage
  if (!isHomePage) {
    overlay.style.display = 'none';
    overlay.style.pointerEvents = 'none';
    return;
  }

  // Show full-screen overlay
  overlay.style.display = 'flex';
  overlay.setAttribute('aria-hidden', 'false');

  // Stage 1: Fly exactly ONE complete circular loop around the central area (2.6s)
  setTimeout(() => {
    overlay.classList.add('stage-flight');
  }, 100);

  // Stage 2a: Character stops near center and raises magic wand at 2.6s
  setTimeout(() => {
    overlay.classList.add('stage-wand');
  }, 2600);

  // Stage 2b: Magic particle beam emerges from wand and sweeps across screen at 2.8s
  setTimeout(() => {
    overlay.classList.add('stage-beam');
  }, 2800);

  // Stage 2c: Wand beam triggers sparkling left-to-right reveal of "PreTwin AI" wordmark
  setTimeout(() => {
    overlay.classList.add('stage-reveal');
  }, 3000);

  // Stage 2d: Reveal official tagline at 3.6s
  setTimeout(() => {
    overlay.classList.add('stage-tagline');
  }, 3600);

  // Stage 3: Enter button becomes available and still screen freeze
  setTimeout(() => {
    overlay.classList.add('stage-freeze');
    overlay.classList.add('stage-ready');
    overlay.classList.add('stage-enter');
  }, 4400);

  // Keyboard accessibility: Enter or Space triggers entry once ready
  window.addEventListener('keydown', function handleIntroKeyPress(e) {
    if (overlay.style.display !== 'none' && overlay.classList.contains('stage-enter')) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        window.removeEventListener('keydown', handleIntroKeyPress);
        finishStartupIntro();
      }
    }
  });
})();

function skipStartupIntro() {
  finishStartupIntro(true);
}

function finishStartupIntro(immediate = false) {
  const overlay = document.getElementById('pretwinStartupIntro');
  if (!overlay || overlay.dataset.finished === '1') return;
  overlay.dataset.finished = '1';
  sessionStorage.setItem('pretwin_intro_played_v10', '1');

  const isLoginPage = window.location.pathname === '/login';
  const isHomePage = window.location.pathname === '/' || window.location.pathname === '';

  if (immediate) {
    overlay.style.transition = 'opacity 0.2s ease';
    overlay.style.opacity = '0';
    overlay.style.pointerEvents = 'none';
    setTimeout(() => {
      overlay.style.display = 'none';
      overlay.setAttribute('aria-hidden', 'true');
      const userLoggedIn = window.PRETWIN_IS_AUTHENTICATED || (window.currentUser && window.currentUser.id);
      if (isHomePage && !userLoggedIn) {
        window.location.href = '/login';
      }
    }, 200);
    return;
  }

  // Smooth dissolve transition
  overlay.classList.add('stage-fadeout');
  overlay.style.pointerEvents = 'none';
  setTimeout(() => {
    overlay.style.display = 'none';
    overlay.setAttribute('aria-hidden', 'true');
    const userLoggedIn = window.PRETWIN_IS_AUTHENTICATED || (window.currentUser && window.currentUser.id);
    if (isHomePage && !userLoggedIn) {
      window.location.href = '/login';
    }
  }, 750);
}
</script>
