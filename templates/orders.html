{% extends "base.html" %}

{% block title %}My Orders — PreTwin{% endblock %}

{% block content %}
<div class="fk-container" style="padding-top: 20px; padding-bottom: 50px;">

  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
    <div>
      <h1 style="font-size:22px; font-weight:700; color:#212121; margin-bottom:4px;">My Orders</h1>
      <p style="font-size:13px; color:#878787;">View purchase receipts, live tracking, and items delivered to you</p>
    </div>
    <a href="/discovery" class="fk-view-all-btn" style="margin-bottom:0; font-size:13px; padding:8px 18px;">
      + Continue Shopping
    </a>
  </div>

  <!-- Orders Container -->
  <div id="ordersListContainer" style="display:flex; flex-direction:column; gap:16px;">
    <div style="background:#ffffff; padding:40px; text-align:center; box-shadow:var(--fk-shadow-sm); border-radius:2px; color:#878787;">
      <p>Loading your orders...</p>
    </div>
  </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
/**
 * PRETWIN ORDERS CONTROLLER
 */
async function loadMyOrders() {
  const container = document.getElementById('ordersListContainer');
  if (!container) return;

  try {
    const res = await apiGet('/api/orders');
    const orders = res.orders || [];

    if (orders.length === 0) {
      container.innerHTML = `
        <div style="background:#ffffff; padding:50px 24px; text-align:center; box-shadow:var(--fk-shadow-sm); border-radius:2px;">
          <img src="https://rukminim1.flixcart.com/www/800/800/promos/16/05/2019/d438a32e-765a-4d8b-b4a6-520b560971e8.png?q=90" style="height:110px; margin-bottom:16px;" alt="No orders">
          <h3 style="font-size:18px; color:#212121; margin-bottom:8px;">You have no orders yet!</h3>
          <p style="color:#878787; font-size:13px; margin-bottom:20px;">Explore over 1,000+ items curated with your PreTwin Personal Shopping Twin.</p>
          <a href="/discovery" class="fk-btn-orange" style="display:inline-block; width:180px; text-decoration:none; padding:10px 0; text-align:center; font-weight:700;">
            Start Shopping
          </a>
        </div>
      `;
      return;
    }

    container.innerHTML = orders.map((od) => {
      const items = od.items || [];
      const dateStr = od.created_at ? new Date(od.created_at).toLocaleDateString('en-IN', {
        year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
      }) : 'Recently';

      const itemsHtml = items.map((it) => {
        const fallbackImg = getCategoryFallbackImg(it.category);
        return `
          <div style="display:flex; align-items:center; gap:16px; padding:12px 0; border-top:1px solid #f0f0f0;">
            <img src="${it.image_url || fallbackImg}" alt="${it.product_name}" style="width:65px; height:65px; object-fit:contain; border:1px solid #eee; border-radius:2px;" onerror="this.src='${fallbackImg}'">
            <div style="flex:1;">
              <div style="font-weight:600; font-size:14px; color:#212121;">${it.product_name}</div>
              <div style="font-size:12px; color:#878787; margin-top:2px;">
                Qty: ${it.quantity} • Category: ${it.category || 'Retail'} • Brand: ${it.brand || 'PreTwin Verified'}
              </div>
            </div>
            <div style="font-size:15px; font-weight:700; color:#212121;">
              ${formatPrice(it.total_price)}
            </div>
          </div>
        `;
      }).join('');

      return `
        <div style="background:#ffffff; border-radius:2px; box-shadow:var(--fk-shadow-sm); padding:20px 24px; border:1px solid #eef0f4;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px; margin-bottom:14px;">
            <div>
              <div style="display:flex; align-items:center; gap:10px; margin-bottom:4px;">
                <span style="font-size:16px; font-weight:700; color:#2874f0;">Order #${od.order_number}</span>
                <span style="background:#e8f5e9; color:#2e7d32; font-size:11px; font-weight:700; padding:2px 8px; border-radius:2px;">
                  ● ${od.status || 'Confirmed'}
                </span>
                <span style="background:#e8f0fe; color:#1a73e8; font-size:11px; font-weight:700; padding:2px 8px; border-radius:2px;">
                  ${od.payment_status || 'Paid'}
                </span>
              </div>
              <div style="font-size:12px; color:#878787;">
                Placed on ${dateStr} • Payment: ${od.payment_method || 'Razorpay'}
              </div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:18px; font-weight:800; color:#212121;">${formatPrice(od.total_amount)}</div>
              <div style="font-size:11px; color:#388e3c; font-weight:600;">Standard Delivery in 2 Days</div>
            </div>
          </div>

          <!-- Items list -->
          <div>
            ${itemsHtml}
          </div>

          <!-- Address & Actions Footer -->
          <div style="margin-top:12px; padding-top:12px; border-top:1px dashed #e0e0e0; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; font-size:12px; color:#666;">
            <div>
              <strong>Delivering to:</strong> ${od.customer_name}, ${od.shipping_address}, ${od.city}, ${od.state} - ${od.pincode}
              ${od.payment_method === 'COD' ? `<div style="color:#d97706; font-weight:700; margin-top:2px;">💵 Cash on Delivery: Pay ${formatPrice(od.cod_amount_due || od.total_amount)} upon delivery</div>` : ''}
              ${od.reward_points_redeemed > 0 ? `<div style="color:#7c3aed; font-weight:600; margin-top:2px;">✨ Redeemed ${od.reward_points_redeemed} reward points (−${formatPrice(od.reward_discount_amount)})</div>` : ''}
              ${od.reward_points_awarded > 0 ? `<div style="color:#059669; font-weight:700; margin-top:2px;">✨ +${od.reward_points_awarded} PreTwin Reward Points Awarded!</div>` : ''}
            </div>
            
            <div style="display:flex; gap:8px; align-items:center;">
              ${(od.status !== 'Delivered' && od.status !== 'Cancelled') ? `
                <button onclick="handleSimulateDelivery(${od.id}, '${od.order_number}')" style="background:#10b981; color:#fff; border:none; padding:6px 12px; border-radius:4px; font-size:11.5px; font-weight:700; cursor:pointer;" title="Simulate delivery & award 5 reward points">
                  ✓ Mark Delivered
                </button>
                <button onclick="handleCancelOrder(${od.id}, '${od.order_number}')" style="background:#fee2e2; color:#b91c1c; border:1px solid #f87171; padding:6px 12px; border-radius:4px; font-size:11.5px; font-weight:600; cursor:pointer;" title="Cancel this order">
                  ✕ Cancel
                </button>
              ` : `
                <span style="font-weight:700; color:${od.status === 'Delivered' ? '#059669' : '#b91c1c'};">
                  ${od.status === 'Delivered' ? '✓ Delivered to Customer' : '✕ Order Cancelled'}
                </span>
              `}
            </div>
          </div>
        </div>
      `;
    }).join('');

  } catch (err) {
    console.error('Failed to load orders:', err);
    container.innerHTML = `
      <div style="background:#fff; padding:30px; text-align:center; color:#c62828;">
        Failed to load orders. Please refresh or sign in again.
      </div>
    `;
  }
}

async function handleSimulateDelivery(orderId, orderNum) {
  if (!confirm(`Mark Order #${orderNum} as Delivered? This will confirm delivery and award 5 PreTwin Reward Points!`)) return;
  try {
    const res = await apiPost(`/api/orders/${orderId}/mark-delivered`, {});
    if (res.success) {
      showToast(`Order #${orderNum} marked as Delivered! +5 Reward Points earned!`, 'success');
      loadMyOrders();
    } else {
      showToast(res.error || 'Failed to update delivery status', 'error');
    }
  } catch (err) {
    showToast(err.message || 'Delivery update failed', 'error');
  }
}

async function handleCancelOrder(orderId, orderNum) {
  if (!confirm(`Are you sure you want to cancel Order #${orderNum}? Any redeemed reward points will be refunded.`)) return;
  try {
    const res = await apiPost(`/api/orders/${orderId}/cancel`, {});
    if (res.success) {
      showToast(`Order #${orderNum} has been cancelled.`, 'info');
      loadMyOrders();
    } else {
      showToast(res.error || 'Failed to cancel order', 'error');
    }
  } catch (err) {
    showToast(err.message || 'Cancel failed', 'error');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  loadMyOrders();
});
</script>
{% endblock %}
